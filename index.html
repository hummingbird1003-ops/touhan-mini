<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<title>登販ミニ模試</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">登販ミニ模試</h1>
  <div id="timer" class="timer" hidden></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><span>🏠</span>ホーム</button>
  <button data-tab="calendar"><span>📅</span>カレンダー</button>
  <button data-tab="stats"><span>📈</span>推移</button>
  <button data-tab="data"><span>📂</span>データ</button>
</nav>

<!-- 配布用の .dat（中身はZIP）も選べるよう、種類で絞り込まない -->
<input type="file" id="filepick" multiple hidden>
<input type="file" id="backuppick" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
